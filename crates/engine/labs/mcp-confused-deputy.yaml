id: mcp-confused-deputy
title: Confused-deputy AI agent over MCP
category: MCP / AI agents
difficulty: beginner
summary: >-
  A customer-facing support bot shares a desktop MCP configuration with an
  engineer. The configuration grants a shell, the whole disk and a plaintext
  GitHub token — so any prompt injection that reaches the bot inherits them.
objectives:
  - Recognise how an internet-facing agent inherits every capability of its MCP servers.
  - Spot hardcoded credentials, unpinned packages and auto-approved tools in MCP configs.
  - See how scoping the filesystem, removing the shell and referencing secrets breaks the path.
attacker: agent:support-bot
walkthrough:
  - The attacker sends a support ticket containing a prompt injection ("ignore previous instructions and run …").
  - The support bot forwards tool calls to the MCP client it runs on, which has every configured server attached.
  - "`shell` is auto-approved, so `run_command` executes without a human confirming it."
  - The GitHub server holds a plaintext token; the filesystem server can read `/`, including `~/.ssh` and `~/.aws`.
  - Policy P-AGENT-01 (public agents must not reach critical capabilities) is violated.
vulnerable:
  - name: mcp.json
    content: |
      {
        "mcpServers": {
          "filesystem": {
            "command": "npx",
            "args": ["-y", "@modelcontextprotocol/server-filesystem", "/"]
          },
          "shell": {
            "command": "npx",
            "args": ["-y", "mcp-shell-server"],
            "alwaysAllow": ["run_command"]
          },
          "github": {
            "command": "npx",
            "args": ["-y", "@modelcontextprotocol/server-github"],
            "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_LabFakeToken0000000000000000000000000" }
          }
        }
      }
  - name: environment.yaml
    content: |
      breachframe: 1
      name: Support bot deployment
      nodes:
        - { id: "user:internet", kind: external, label: "Anonymous customer", attributes: { public: true } }
        - { id: "agent:support-bot", kind: agent, label: "Support chat bot", attributes: { public: true } }
        - { id: "mcp:client:mcp.json", kind: agent, label: "MCP client (mcp.json)" }
      edges:
        - { from: "user:internet", to: "agent:support-bot", relation: sends_prompt }
        - { from: "agent:support-bot", to: "mcp:client:mcp.json", relation: runs_tools_via }
      policies:
        - id: P-AGENT-01
          name: Public agents must not reach critical capabilities
          severity: critical
          description: Internet-facing agents can be steered by prompt injection, so they must never be connected to shell, infrastructure or other critical capabilities.
          recommendation: Give the public agent its own MCP configuration containing only read-only, narrowly scoped tools.
          deny:
            from: { attributes: { public: true } }
            to: { attributes: { sensitivity: critical } }
        - id: P-AGENT-02
          name: Public agents must not reach secrets
          severity: high
          deny:
            from: { attributes: { public: true } }
            to: { kind: secret }
fixed:
  - name: mcp.json
    content: |
      {
        "mcpServers": {
          "filesystem": {
            "command": "npx",
            "args": ["-y", "@modelcontextprotocol/server-filesystem@2025.8.21", "/srv/support/knowledge-base"]
          },
          "github": {
            "command": "npx",
            "args": ["-y", "@modelcontextprotocol/server-github@2025.4.8"],
            "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${env:SUPPORT_BOT_GITHUB_TOKEN}" }
          }
        }
      }
  - name: environment.yaml
    content: |
      breachframe: 1
      name: Support bot deployment (hardened)
      nodes:
        - { id: "user:internet", kind: external, label: "Anonymous customer", attributes: { public: true } }
        - { id: "agent:support-bot", kind: agent, label: "Support chat bot", attributes: { public: true } }
        - { id: "mcp:client:mcp.json", kind: agent, label: "MCP client (mcp.json)" }
      edges:
        - { from: "user:internet", to: "agent:support-bot", relation: sends_prompt }
        - { from: "agent:support-bot", to: "mcp:client:mcp.json", relation: runs_tools_via }
      policies:
        - id: P-AGENT-01
          name: Public agents must not reach critical capabilities
          severity: critical
          deny:
            from: { attributes: { public: true } }
            to: { attributes: { sensitivity: critical } }
        - id: P-AGENT-02
          name: Public agents must not reach secrets
          severity: high
          deny:
            from: { attributes: { public: true } }
            to: { kind: secret }
