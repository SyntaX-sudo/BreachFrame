[package]
name = "breachframe-app"
description = "BreachFrame desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "breachframe-app"

[lib]
name = "breachframe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
breachframe-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Enabled for production builds; `tauri dev` disables it to load the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
